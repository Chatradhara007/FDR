# Phase 0 creates the Dockerfiles referenced here.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fdr
      POSTGRES_PASSWORD: fdr
      POSTGRES_DB: fdr
      TZ: Asia/Kolkata
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d   # creates fdr_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdr -d fdr"]
      interval: 3s
      retries: 20

  mock-bank:
    build: { context: ., dockerfile: mock-bank/Dockerfile }
    environment:
      MOCK_BANK_PORT: 4000
      MOCK_BANK_OFFLINE_BANKS: ${MOCK_BANK_OFFLINE_BANKS:-Indian Overseas Bank}
      MOCK_BANK_SLOW_BANKS: ${MOCK_BANK_SLOW_BANKS:-Bank of India}
      MOCK_BANK_SLOW_SECONDS: ${MOCK_BANK_SLOW_SECONDS:-10}
    ports: ["4000:4000"]
    volumes: [mockbankdata:/app/mock-bank/data]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      mock-bank: { condition: service_started }
    environment:
      DATABASE_URL: postgres://fdr:fdr@db:5432/fdr
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      MOCK_BANK_URL: http://mock-bank:4000
      STORAGE_DIR: /data/storage
      TZ: Asia/Kolkata
      DEMO_MODE: ${DEMO_MODE:-true}
      PORT: 3000
    ports: ["3000:3000"]
    volumes: [storage:/data/storage]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports: ["5173:5173"]

volumes:
  pgdata:
  storage:
  mockbankdata:
