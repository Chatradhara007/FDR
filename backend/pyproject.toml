[project]
name = "fdr-backend"
version = "0.0.0"
description = "FDR Portal API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "bcrypt>=4.2",
  "PyJWT>=2.9",
  "python-multipart>=0.0.18",
  "filetype>=1.2",
  "APScheduler>=3.10,<4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "cryptography>=43",
  "qrcode>=7.4",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-qrcode>=8.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]  # long lines: SQL kept verbatim; the formatter wraps code

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["filetype", "filetype.*", "apscheduler.*"]
ignore_missing_imports = true
